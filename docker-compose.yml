version: '3.8'

services:
  db:
    image: postgres:15
    container_name: wiki_postgres
    restart: always
    environment:
      POSTGRES_DB: wiki_steampunk_db
      POSTGRES_USER: admin_wiki
      POSTGRES_PASSWORD: vapor123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: